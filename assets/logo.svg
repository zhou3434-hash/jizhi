<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="寻万卷书">
  <title>寻万卷书</title>

  <!-- 平放的书：实心书体 -->
  <rect x="7" y="35" width="44" height="13" rx="2.2" fill="#6b4a2f"/>
  <!-- 书口留白线，暗示书页 -->
  <line x1="12" y1="39.5" x2="42" y2="39.5" stroke="#fdfaf4" stroke-width="1.3" stroke-opacity="0.55"/>
  <line x1="12" y1="43.5" x2="42" y2="43.5" stroke="#fdfaf4" stroke-width="1.3" stroke-opacity="0.55"/>

  <!-- 斜放的书：封面 + 书脊厚度 -->
  <path d="M12 23.5 L37 14 L42.5 22.5 L17.5 32 Z" fill="#fdfaf4" stroke="#6b4a2f"
        stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M12 23.5 L17.5 32 L18.2 27.2 L12.7 18.7 Z" fill="#6b4a2f" stroke="#6b4a2f"
        stroke-width="1.4" stroke-linejoin="round"/>

  <!-- 放大镜：只压住书的一角，保证小尺寸仍能辨认 -->
  <circle cx="42" cy="34.5" r="11.5" fill="#fdfaf4" stroke="#6b4a2f" stroke-width="3"/>
  <line x1="50.3" y1="42.8" x2="57.5" y2="50" stroke="#6b4a2f" stroke-width="3.8"
        stroke-linecap="round"/>
</svg>
